name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does it solve?
      description: Describe the situation, not the implementation.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: Proposed solution
      description: If you have an idea, sketch it here.
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        Please keep in mind: spotwave is a client-side Spicetify app and cannot use endpoints
        that the Spotify client does not call itself.
