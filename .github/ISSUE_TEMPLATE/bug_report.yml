name: Bug report
description: Something is broken or behaves unexpectedly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please fill in the versions — most issues are client-version specific.

  - type: input
    id: spotify
    attributes:
      label: Spotify version
      description: Settings → About
      placeholder: 1.3.10.2586
    validations:
      required: true

  - type: input
    id: spicetify
    attributes:
      label: Spicetify version
      description: Output of `spicetify -v`
      placeholder: 2.46.7
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What happened?
      description: Steps to reproduce, in order.
    validations:
      required: true

  - type: textarea
    id: console
    attributes:
      label: Console output
      description: DevTools console (`Ctrl+Shift+I`), filtered by `[wave]`.
      render: shell
