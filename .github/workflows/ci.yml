name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: JavaScript syntax
        run: |
          node --check app/index.js
          node --check app/extension.js

      - name: Manifest
        run: |
          node -e "const m=require('./app/manifest.json'); if(!m.name||!m.icon) process.exit(1); console.log('manifest ok:', m.name, m.version||'')"

      - name: Required files
        run: |
          for f in README.md README.ru.md LICENSE CHANGELOG.md app/style.css; do
            test -f "$f" || (echo "missing $f" && exit 1)
          done

      - name: Installer syntax
        run: bash -n scripts/install.sh
